<style>
  :root{
    --bg:#191721;
    --card:#231f2e;
    --card-2:#2b2638;
    --line:#37324485;
    --txt:#f5f3fa;
    --sub:#a79fc2;
    --accent:#ab9ff2;
    --accent-dim:#33294f;
    --green:#5dcaa5;
    --green-dim:#085041;
    --red:#f09595;
    --red-dim:#4a1b0c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  .app{
    max-width:420px;
    margin:0 auto;
    min-height:100vh;
    padding:18px 16px 100px;
  }
  .demo-tag{
    text-align:center;
    font-size:11px;
    letter-spacing:.08em;
    color:var(--sub);
    background:var(--card-2);
    border:1px solid var(--line);
    border-radius:20px;
    padding:6px 12px;
    display:inline-block;
    margin-bottom:16px;
  }
  .demo-row{text-align:center;}
  .header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:22px;
  }
  .header .name{font-size:15px; font-weight:600;}
  .header .sub{font-size:12px; color:var(--sub); margin-top:2px;}
  .avatar{
    width:38px;height:38px;border-radius:50%;
    background:var(--accent-dim);
    display:flex;align-items:center;justify-content:center;
    color:var(--accent); font-weight:600; font-size:14px;
  }
  .balance-card{
    background:linear-gradient(180deg,#2b2640,#1f1c2c);
    border:1px solid var(--line);
    border-radius:20px;
    padding:22px 20px;
    margin-bottom:18px;
  }
  .balance-label{font-size:12px; color:var(--sub); margin-bottom:6px;}
  .balance-value{
    font-size:36px;
    font-weight:700;
    display:flex;
    align-items:baseline;
    gap:6px;
    cursor:text;
  }
  .balance-value span.cur{font-size:18px; color:var(--sub); font-weight:500;}
  .balance-change{
    font-size:13px;
    color:var(--green);
    margin-top:8px;
    display:flex;
    align-items:center;
    gap:4px;
  }
  .actions{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin:18px 0 22px;
  }
  .action-btn{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 4px 12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    font-size:11px;
    color:var(--txt);
  }
  .action-btn .icircle{
    width:34px;height:34px;
    border-radius:50%;
    background:var(--accent-dim);
    display:flex;align-items:center;justify-content:center;
  }
  .action-btn i{font-size:18px; color:var(--accent);}
  .action-btn:active{background:var(--card-2);}
  .section-title{
    font-size:14px;
    font-weight:600;
    margin:20px 0 10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .section-title .add{
    font-size:12px; color:var(--accent); font-weight:500;
  }
  .asset{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px;
    margin-bottom:8px;
  }
  .asset .icon{
    width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:15px; font-weight:600;
    flex-shrink:0;
  }
  .asset .info{flex:1; min-width:0;}
  .asset .info .t{font-size:14px; font-weight:600;}
  .asset .info .s{font-size:12px; color:var(--sub);}
  .asset .amounts{text-align:right;}
  .asset .amounts input{
    width:100px;
    text-align:right;
    background:transparent;
    border:none;
    color:var(--txt);
    font-size:14px;
    font-weight:600;
    padding:0;
  }
  .asset .amounts input:focus{outline:none;}
  .asset .amounts .qty{
    width:100px;
    background:transparent;
    border:none;
    color:var(--sub);
    font-size:12px;
    text-align:right;
    padding:0;
    margin-top:2px;
  }
  .asset .amounts .qty:focus{outline:none;}
  .history-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 2px;
    border-bottom:1px solid var(--line);
  }
  .history-item:last-child{border-bottom:none;}
  .hicon{
    width:32px;height:32px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;
  }
  .hicon.in{background:var(--green-dim); color:var(--green);}
  .hicon.out{background:var(--red-dim); color:var(--red);}
  .hinfo{flex:1;}
  .hinfo .t{font-size:13px; font-weight:500;}
  .hinfo .d{font-size:11px; color:var(--sub);}
  .hval{font-size:13px; font-weight:600;}
  .hval.in{color:var(--green);}
  .hval.out{color:var(--red);}
  .add-asset-form{
    display:none;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px;
    margin-bottom:10px;
    gap:8px;
    flex-direction:column;
  }
  .add-asset-form.open{display:flex;}
  .add-asset-form input{width:100%;}
  .add-asset-form .row{display:flex; gap:8px;}
  .add-asset-form button{
    background:var(--accent);
    color:#fff;
    border:none;
    font-weight:600;
  }
  .reset-row{margin-top:24px; text-align:center;}
  .reset-row button{
    background:none;
    border:1px solid var(--line);
    color:var(--sub);
    font-size:12px;
    padding:8px 16px;
  }
</style>
</head>

  </div>

  <div class="balance-card">
    <div class="balance-label">Total balance</div>
    <div class="balance-value">
      <span class="cur">$</span>
      <input id="totalBalance" value="24580.32" inputmode="decimal"
        style="background:transparent;border:none;color:var(--txt);font-size:36px;font-weight:700;width:100%;padding:0;">
    </div>
    <div class="balance-change">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 9 11 13 15 21 6"/><polyline points="14 6 21 6 21 13"/></svg>
      +$<input id="recentAmount" value="342.18" inputmode="decimal"
        style="background:transparent;border:none;color:var(--green);font-size:13px;font-weight:600;width:60px;padding:0;">
      <span id="recentPct" style="color:var(--green);">(+1.4%)</span>
      <span style="color:var(--sub);">today</span>
    </div>
  </div>

  <div class="actions">
    <div class="action-btn"><div class="icircle"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></div>Send</div>
    <div class="action-btn"><div class="icircle"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg></div>Receive</div>
    <div class="action-btn"><div class="icircle"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 3 21 7 17 11"/><path d="M3 7h18"/><polyline points="7 21 3 17 7 13"/><path d="M21 17H3"/></svg></div>Swap</div>
    <div class="action-btn" id="addBtn"><div class="icircle"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>Add</div>
  </div>

  <div class="add-asset-form" id="addForm">
    <div class="row">
      <input id="newSymbol" placeholder="Symbol (e.g. SOL)" style="background:var(--card-2);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:8px;">
      <input id="newQty" placeholder="Amount" inputmode="decimal" style="background:var(--card-2);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:8px;">
    </div>
    <input id="newValue" placeholder="Total value in $" inputmode="decimal" style="background:var(--card-2);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:8px;">
    <button id="confirmAdd" style="border-radius:8px;padding:10px;">Add asset</button>
  </div>

  <div class="section-title">Your assets <span class="add" id="toggleAdd">+ new</span></div>
  <div id="assetsList"></div>

  <div class="section-title">Recent activity</div>
  <div class="asset" style="flex-direction:column; align-items:stretch;">
    <div id="historyList"></div>
  </div>

  <div class="reset-row"><button id="resetBtn">Reset sample data</button></div>
</div>

<script>
const defaultAssets = [
  {sym:"BTC", name:"Bitcoin", color1:"#412402", color2:"#EF9F27", qty:0.42, value:18230.10},
  {sym:"ETH", name:"Ethereum", color1:"#042C53", color2:"#378ADD", qty:2.15, value:4980.55},
  {sym:"USDT", name:"Tether", color1:"#04342C", color2:"#1D9E75", qty:1369.67, value:1369.67}
];
const defaultHistory = [
  {t:"Received from 0x91...bA2", d:"Today, 10:42am", amt:"+0.05 BTC", dir:"in"},
  {t:"Sent to 0x4c...9F1", d:"Yesterday, 6:05pm", amt:"-120 USDT", dir:"out"},
  {t:"Swap ETH → USDT", d:"Jul 27", amt:"-0.3 ETH", dir:"out"}
];

let assets = JSON.parse(JSON.stringify(defaultAssets));
let history = JSON.parse(JSON.stringify(defaultHistory));

function renderAssets(){
  const list = document.getElementById('assetsList');
  list.innerHTML = '';
  assets.forEach((a, i) => {
    const div = document.createElement('div');
    div.className = 'asset';
    div.innerHTML = `
      <div class="icon" style="background:${a.color1}; color:${a.color2}; overflow:hidden;">
        <img src="https://cdn.jsdelivr.net/gh/spothq/cryptocurrency-icons@master/128/color/${a.sym.toLowerCase()}.png"
          onerror="this.style.display='none'; this.parentElement.textContent='${a.sym.slice(0,1)}';"
          style="width:24px;height:24px;object-fit:contain;">
      </div>
      <div class="info">
        <div class="t">${a.name}</div>
        <div class="s">${a.sym}</div>
      </div>
      <div class="amounts">
        <input class="valInput" data-i="${i}" value="${a.value.toFixed(2)}" inputmode="decimal">
        <input class="qty qtyInput" data-i="${i}" value="${a.qty} ${a.sym}" inputmode="decimal">
      </div>
    `;
    list.appendChild(div);
  });
  document.querySelectorAll('.valInput').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const i = e.target.dataset.i;
      assets[i].value = parseFloat(e.target.value) || 0;
      updateTotal();
    });
  });
  document.querySelectorAll('.qtyInput').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const i = e.target.dataset.i;
      const num = parseFloat(e.target.value);
      if(!isNaN(num)) assets[i].qty = num;
    });
  });
}

function renderHistory(){
  const list = document.getElementById('historyList');
  list.innerHTML = '';
  history.forEach(h=>{
    const div = document.createElement('div');
    div.className = 'history-item';
    div.innerHTML = `
      <div class="hicon ${h.dir}"><i class="ti ti-${h.dir==='in'?'arrow-down-left':'arrow-up-right'}"></i></div>
      <div class="hinfo">
        <div class="t">${h.t}</div>
        <div class="d">${h.d}</div>
      </div>
      <div class="hval ${h.dir}">${h.amt}</div>
    `;
    list.appendChild(div);
  });
}

function updateTotal(){
  const sum = assets.reduce((s,a)=>s+a.value,0);
  document.getElementById('totalBalance').value = sum.toFixed(2);
  updateRecentPct();
}

function updateRecentPct(){
  const total = parseFloat((document.getElementById('totalBalance').value || '').replace(/,/g,'')) || 0;
  const recent = parseFloat((document.getElementById('recentAmount').value || '').replace(/,/g,'')) || 0;
  const pctEl = document.getElementById('recentPct');
  if(total > 0){
    const pct = (recent / total) * 100;
    pctEl.textContent = `(+${pct.toFixed(2)}%)`;
  } else {
    pctEl.textContent = '(+0.00%)';
  }
}

document.getElementById('recentAmount').addEventListener('input', updateRecentPct);

document.getElementById('totalBalance').addEventListener('input', e=>{
  // the user can overwrite the total freely, without recalculating assets or the percentage
});

document.getElementById('toggleAdd').addEventListener('click', ()=>{
  document.getElementById('addForm').classList.toggle('open');
});
document.getElementById('addBtn').addEventListener('click', ()=>{
  document.getElementById('addForm').classList.toggle('open');
});

document.getElementById('confirmAdd').addEventListener('click', ()=>{
  const sym = (document.getElementById('newSymbol').value || 'NEW').toUpperCase().slice(0,5);
  const qty = parseFloat(document.getElementById('newQty').value) || 0;
  const value = parseFloat(document.getElementById('newValue').value) || 0;
  assets.push({sym, name:sym, color1:"#26215C", color2:"#7F77DD", qty, value});
  document.getElementById('newSymbol').value='';
  document.getElementById('newQty').value='';
  document.getElementById('newValue').value='';
  document.getElementById('addForm').classList.remove('open');
  renderAssets();
  updateTotal();
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  assets = JSON.parse(JSON.stringify(defaultAssets));
  history = JSON.parse(JSON.stringify(defaultHistory));
  renderAssets();
  renderHistory();
  updateTotal();
});

renderAssets();
renderHistory();
updateTotal();
updateRecentPct();
</script>
</body>
</html>
